<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asteroid Blaster</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
    margin: auto;
    background: #050510;
}

#score {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 24px;
}
</style>
</head>
<body>

<div id="score">Pontos: 0</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let score = 0;

const ship = {
    x: canvas.width / 2,
    y: canvas.height - 80,
    width: 40,
    height: 25,
    speed: 7
};

const bullets = [];
const asteroids = [];

const keys = {};

document.addEventListener("keydown", (e) => {
    keys[e.code] = true;

    if (e.code === "Space") {
        bullets.push({
            x: ship.x,
            y: ship.y - 15,
            radius: 4,
            speed: 10
        });
    }
});

document.addEventListener("keyup", (e) => {
    keys[e.code] = false;
});

function createAsteroid() {
    asteroids.push({
        x: Math.random() * canvas.width,
        y: -30,
        radius: 15 + Math.random() * 25,
        speed: 2 + Math.random() * 3
    });
}

setInterval(createAsteroid, 900);

function drawShip() {
    ctx.fillStyle = "cyan";

    ctx.beginPath();
    ctx.moveTo(ship.x, ship.y - 20);
    ctx.lineTo(ship.x - 20, ship.y + 15);
    ctx.lineTo(ship.x + 20, ship.y + 15);
    ctx.closePath();
    ctx.fill();
}

function drawBullets() {
    ctx.fillStyle = "yellow";

    bullets.forEach((bullet, index) => {
        bullet.y -= bullet.speed;

        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
        ctx.fill();

        if (bullet.y < 0) {
            bullets.splice(index, 1);
        }
    });
}

function drawAsteroids() {
    ctx.fillStyle = "gray";

    asteroids.forEach((asteroid, index) => {
        asteroid.y += asteroid.speed;

        ctx.beginPath();
        ctx.arc(
            asteroid.x,
            asteroid.y,
            asteroid.radius,
            0,
            Math.PI * 2
        );
        ctx.fill();

        if (asteroid.y > canvas.height + 50) {
            asteroids.splice(index, 1);
        }

        const dx = asteroid.x - ship.x;
        const dy = asteroid.y - ship.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < asteroid.radius + 15) {
            alert("Game Over! Pontuação: " + score);
            location.reload();
        }
    });
}

function collisions() {
    bullets.forEach((bullet, bIndex) => {
        asteroids.forEach((asteroid, aIndex) => {

            const dx = bullet.x - asteroid.x;
            const dy = bullet.y - asteroid.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < asteroid.radius + bullet.radius) {
                bullets.splice(bIndex, 1);
                asteroids.splice(aIndex, 1);

                score += 10;
                document.getElementById("score").textContent =
                    "Pontos: " + score;
            }
        });
    });
}

function update() {

    if (keys["ArrowLeft"] && ship.x > 20) {
        ship.x -= ship.speed;
    }

    if (keys["ArrowRight"] && ship.x < canvas.width - 20) {
        ship.x += ship.speed;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawShip();
    drawBullets();
    drawAsteroids();
    collisions();

    requestAnimationFrame(update);
}

update();

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>
